name: arti

services:
  postgres:
    image: postgres:16-alpine
    container_name: arti-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arti_dev
    ports:
      - "5436:5432"
    volumes:
      - arti_pg_data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Probe over TCP (-h), not the unix socket. During initdb the postgres
      # image runs a temporary server with listen_addresses='' — socket up,
      # TCP closed — so a socket probe can report ready before anything can
      # actually connect, and the `migrate` service (depends_on:
      # service_healthy) then dies with "connection refused" on a cold start.
      test: ["CMD-SHELL", "pg_isready -U postgres -d arti_dev -h 127.0.0.1"]
      interval: 2s
      timeout: 2s
      retries: 30

  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: arti-rustfs
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: admin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    command: ["/usr/bin/rustfs"]
    ports:
      - "9210:9000"
      - "9211:9001"
    volumes:
      - arti_rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 30

  rustfs-init:
    image: amazon/aws-cli:2.22.35
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: admin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -ec "
      (aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket arti-dev 2>/dev/null || aws --endpoint-url http://rustfs:9000 s3 mb s3://arti-dev) &&
      (aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket arti-test 2>/dev/null || aws --endpoint-url http://rustfs:9000 s3 mb s3://arti-test)
      "

  # Dex — a lightweight OIDC issuer for developing and e2e-testing the
  # built-in `oidc` login mode (auth.mode=oidc). Static test user:
  # admin@example.com / password. See dex-config.yaml.
  dex:
    image: dexidp/dex:v2.41.1
    container_name: arti-dex
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    ports:
      - "5556:5556"
    volumes:
      - ./dex-config.yaml:/etc/dex/config.yaml:ro

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    container_name: arti-opensearch
    environment:
      - discovery.type=single-node
      # LOCAL DEV ONLY: no auth on this node so `make dev-up` needs no setup.
      # Real deployments use a managed/secured OpenSearch endpoint with
      # basic auth or IAM — see web/docs/operations/opensearch.md.
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx256m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - arti_os_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  arti_pg_data:
  arti_rustfs_data:
  arti_os_data:
