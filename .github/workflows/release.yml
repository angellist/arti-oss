# Public release: on a version tag, produce CLI + server archives with
# checksums, and publish the tag's CHANGELOG.md section as the release body.
#
# The notes file is written to $RUNNER_TEMP, never the checkout: goreleaser
# refuses to run on a dirty tree, and an untracked file counts as dirty.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fails the release if the tag has no section, so a tag can never ship
      # with an empty or someone else's notes.
      - name: Extract release notes for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md" || { echo "no CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }
          cat "$RUNNER_TEMP/release-notes.md"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
